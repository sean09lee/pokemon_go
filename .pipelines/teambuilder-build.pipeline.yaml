# CI build pipeline for PokemonGoTeamBuilder
# - Restores, builds, tests, and publishes the Blazor web app
# - Produces a tested Linux container image consumed by the release pipeline
trigger:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotNetVersion: '10.0.x'
  solutionPath: 'TeamBuilder/TeamBuilder.slnx'
  webProjectPath: 'TeamBuilder/TeamBuilder.csproj'
  testProjectPath: 'TeamBuilder.Tests/TeamBuilder.Tests.csproj'
  artifactName: 'teambuilder'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '$(dotNetVersion)'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '$(solutionPath)'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '$(solutionPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: '$(testProjectPath)'
    publishTestResults: false
    arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults'

- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(Agent.TempDirectory)/TestResults'
    mergeTestResults: true
    failTaskOnFailedTests: true

- task: Docker@2
  displayName: 'Build Linux container'
  inputs:
    command: 'build'
    repository: 'teambuilder'
    Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)'
    tags: '$(Build.BuildId)'

- task: PowerShell@2
  displayName: 'Verify Chromium and export container'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $ErrorActionPreference = 'Stop'
      $image = 'teambuilder:$(Build.BuildId)'
      $browserCheck = "const { chromium } = require('/app/.playwright/package'); (async () => { const browser = await chromium.launch({ headless: true }); await browser.close(); })().catch(error => { console.error(error); process.exit(1); });"
      docker run --rm --ipc=host --entrypoint /app/.playwright/node/linux-x64/node $image -e $browserCheck
      if ($LASTEXITCODE -ne 0) {
          throw 'Chromium failed to launch inside the Linux container.'
      }

      docker image save --output '$(Build.ArtifactStagingDirectory)/image.tar' $image
      if ($LASTEXITCODE -ne 0) {
          throw 'Failed to export the container image.'
      }

- task: PublishPipelineArtifact@1
  displayName: 'Publish Artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/image.tar'
    artifactName: '$(artifactName)'
