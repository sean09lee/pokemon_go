# Release pipeline for PokemonGoTeamBuilder
# - Downloads the tested Linux container produced by the build pipeline
# - Pushes to the environment registry and deploys with managed-identity image pulls
#
# Single parameter: environment. Resource names are resolved at runtime from
# infrastructure/_common.ps1 (Get-InfraNames) so they always match what the
# infrastructure pipeline created, including the unique suffix.
# Prerequisite: an Azure Resource Manager service connection named
# 'teambuilder-connection' must exist in the Azure DevOps project settings.
parameters:
- name: environment
  displayName: 'Environment'
  type: string
  default: 'dev'
  values:
  - dev
  - test
  - prod

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

resources:
  pipelines:
  - pipeline: build
    source: 'TeamBuilder-Build'
    trigger: none

# resourceGroup and webAppName are set at runtime by the 'Resolve resource names'
# step below, sourced from infrastructure/_common.ps1.
variables:
  azureSubscription: 'teambuilder_connection'
  artifactName: 'teambuilder'

stages:
- stage: Deploy_${{ parameters.environment }}
  displayName: 'Deploy to ${{ parameters.environment }}'
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Web App'
    environment: '${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: build
            artifact: '$(artifactName)'
          - task: AzureCLI@2
            displayName: 'Push and deploy Linux container'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                . "$(Build.SourcesDirectory)/infrastructure/_common.ps1"
                $names = Get-InfraNames -Environment '${{ parameters.environment }}'
                $buildId = '$(resources.pipeline.build.runID)'
                if ($buildId -notmatch '^\d+$') { throw 'Unable to resolve the source build ID.' }
                $registryServer = az acr show --name $names.Registry --resource-group $names.ResourceGroup --query loginServer -o tsv
                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($registryServer)) {
                    throw 'Container registry not found. Run infrastructure for this environment first.'
                }
                $sourceImage = "teambuilder:$buildId"
                $image = "$registryServer/teambuilder:$buildId"
                docker image load --input '$(Pipeline.Workspace)/build/$(artifactName)/image.tar'
                if ($LASTEXITCODE -ne 0) { throw 'Failed to load the container artifact.' }
                docker image tag $sourceImage $image
                if ($LASTEXITCODE -ne 0) { throw 'Failed to tag the container image.' }
                az acr login --name $names.Registry --output none
                if ($LASTEXITCODE -ne 0) { throw 'Failed to authenticate to the container registry. The service connection requires AcrPush access.' }
                docker image push $image
                if ($LASTEXITCODE -ne 0) { throw 'Failed to push the container image. Verify the service connection has AcrPush access.' }

                $connectionString = az appconfig credential list --name $names.AppConfig --resource-group $names.ResourceGroup --query "[?name=='Primary'].connectionString" -o tsv
                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($connectionString)) {
                    throw 'Failed to resolve the App Configuration connection string.'
                }
                Write-Host "##vso[task.setsecret]$connectionString"
                $label = '${{ parameters.environment }}'.ToLowerInvariant()
                az webapp config appsettings delete --name $names.WebApp --resource-group $names.ResourceGroup --setting-names WEBSITE_RUN_FROM_PACKAGE WEBSITE_RUN_FROM_ZIP --output none
                if ($LASTEXITCODE -ne 0) { throw 'Failed to clear obsolete ZIP deployment settings.' }
                az webapp config appsettings set --name $names.WebApp --resource-group $names.ResourceGroup --settings "ConnectionStrings__AppConfiguration=$connectionString" "ConnectionStrings__Label=$label" WEBSITES_PORT=8080 ASPNETCORE_HTTP_PORTS=8080 PLAYWRIGHT_BROWSERS_PATH=/ms-playwright --output none
                if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the application environment.' }
                az webapp config container set --name $names.WebApp --resource-group $names.ResourceGroup --container-image-name $image --container-registry-url "https://$registryServer" --output none
                if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the container image.' }
                az webapp restart --name $names.WebApp --resource-group $names.ResourceGroup --output none
                if ($LASTEXITCODE -ne 0) { throw 'Failed to restart the container app.' }
                Write-Host "Deployed $image to https://$($names.WebApp).azurewebsites.net"
