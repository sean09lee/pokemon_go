# Release pipeline for PokemonGoTeamBuilder
# - Downloads the zip artifact produced by build.pipeline.yaml
# - Deploys to Azure App Service for the selected environment
#
# Single parameter: environment. Resource names are resolved at runtime from
# infrastructure/_common.ps1 (Get-InfraNames) so they always match what the
# infrastructure pipeline created, including the unique suffix.
# Prerequisite: an Azure Resource Manager service connection named
# 'teambuilder-connection' must exist in the Azure DevOps project settings.
parameters:
- name: environment
  displayName: 'Environment'
  type: string
  default: 'dev'
  values:
  - dev
  - test
  - prod

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: build
    source: 'TeamBuilder-Build'
    trigger: true

# resourceGroup and webAppName are set at runtime by the 'Resolve resource names'
# step below, sourced from infrastructure/_common.ps1.
variables:
  azureSubscription: 'teambuilder_connection'
  artifactName: 'teambuilder'

stages:
- stage: Deploy_${{ parameters.environment }}
  displayName: 'Deploy to ${{ parameters.environment }}'
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Web App'
    environment: '${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: build
            artifact: '$(artifactName)'
          - task: AzureCLI@2
            displayName: 'Resolve resource names'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                . "$(Build.SourcesDirectory)/infrastructure/_common.ps1"
                $names = Get-InfraNames -Environment '${{ parameters.environment }}'
                Write-Host "##vso[task.setvariable variable=resourceGroup]$($names.ResourceGroup)"
                Write-Host "##vso[task.setvariable variable=webAppName]$($names.WebApp)"
                Write-Host "##vso[task.setvariable variable=appConfigName]$($names.AppConfig)"
          - task: AzureCLI@2
            displayName: 'Update appsettings.json with App Configuration connection string and label'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $connectionString = (az appconfig credential list --name $(appConfigName) --resource-group $(resourceGroup) --query "[?name=='Primary'].connectionString" -o tsv)
                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($connectionString)) {
                    throw "Failed to resolve the primary connection string for App Configuration '$(appConfigName)'."
                }

                $label = '${{ parameters.environment }}'.ToLowerInvariant()

                $zipPath = Get-ChildItem -Path '$(Pipeline.Workspace)/build/$(artifactName)' -Filter '*.zip' -Recurse | Select-Object -First 1 -ExpandProperty FullName
                if ([string]::IsNullOrWhiteSpace($zipPath)) {
                    throw "Could not locate the published zip artifact under '$(Pipeline.Workspace)/build/$(artifactName)'."
                }

                $extractPath = Join-Path '$(Agent.TempDirectory)' 'app-package'
                if (Test-Path $extractPath) {
                    Remove-Item $extractPath -Recurse -Force
                }
                Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

                $appSettingsPath = Join-Path $extractPath 'appsettings.json'
                if (-not (Test-Path $appSettingsPath)) {
                    throw "appsettings.json was not found in the published package at '$appSettingsPath'."
                }

                $appSettings = Get-Content $appSettingsPath -Raw | ConvertFrom-Json
                $appSettings.ConnectionStrings.AppConfiguration = $connectionString
                $appSettings.ConnectionStrings.Label = $label
                $appSettings | ConvertTo-Json -Depth 10 | Set-Content $appSettingsPath -Encoding utf8

                Remove-Item $zipPath -Force
                Compress-Archive -Path (Join-Path $extractPath '*') -DestinationPath $zipPath -Force
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webApp'
              appName: '$(webAppName)'
              resourceGroupName: '$(resourceGroup)'
              package: '$(Pipeline.Workspace)/build/$(artifactName)/**/*.zip'
              deploymentMethod: 'zipDeploy'
